[project]
name = "buchuchet-api"
version = "0.1.0"
description = "Buchuchet AI backoffice OS — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "gunicorn>=23.0",
  "pydantic>=2.9",
  "email-validator>=2.2",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0.1,<4.1",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "boto3>=1.35",
  "openai>=1.55",
  "anthropic>=0.40",
  "structlog>=24.4",
  "resend>=2.0",
  "python-docx>=1.1",
  "docxtpl>=0.16",
  "openpyxl>=3.1",
  "pypdf>=4.3",
  "tenacity>=9.0",
  "xhtml2pdf>=0.2.16",
  "striprtf>=0.0.26",
  "num2words>=0.5.13",
  "langdetect>=1.0.9",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
