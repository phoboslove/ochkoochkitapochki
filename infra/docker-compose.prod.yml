services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-buchuchet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-buchuchet}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buchuchet} -d ${POSTGRES_DB:-buchuchet}"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ../.env.prod
    depends_on:
      postgres: { condition: service_healthy }
      minio:    { condition: service_started }
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-buchuchet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buchuchet}
      ALEMBIC_URL:  postgresql+psycopg://${POSTGRES_USER:-buchuchet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buchuchet}
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    restart: unless-stopped
    depends_on: [api]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports: ["80:80", "443:443"]
    depends_on: [web, api]

volumes:
  pgdata:
  miniodata:
