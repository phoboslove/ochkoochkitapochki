services:
  # Only needed if you're running Postgres in-stack instead of a managed
  # provider (Neon, RDS, ...). Not started by default — `docker compose up`
  # ignores it unless you pass `--profile local-db`. When using a managed
  # provider instead, just set DATABASE_URL directly in .env.prod; the api
  # service below no longer hardcodes a postgres:// URL, so whatever
  # .env.prod says wins.
  postgres:
    image: postgres:16
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-buchuchet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-buchuchet}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buchuchet} -d ${POSTGRES_DB:-buchuchet}"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file: ../.env.prod
    depends_on:
      minio: { condition: service_started }
    environment:
      # DATABASE_URL / ALEMBIC_URL come from .env.prod — set them to your
      # managed Postgres DSN, or to the local-db service's DSN
      # (postgresql+asyncpg://${POSTGRES_USER:-buchuchet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buchuchet})
      # if you're running --profile local-db.
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    restart: unless-stopped
    depends_on: [api]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports: ["80:80", "443:443"]
    depends_on: [web, api]

volumes:
  pgdata:
  miniodata:
