# Deployment-specific config for wagwan1.com — subdomain split:
#   wagwan1.com / www.wagwan1.com -> web (Next.js)
#   api.wagwan1.com               -> api (FastAPI)
# Generated for the wagwan1.com deploy; infra/nginx.conf (path-based, single
# domain) remains the generic template for other deployments.

server {
    listen 80;
    server_name wagwan1.com www.wagwan1.com api.wagwan1.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wagwan1.com www.wagwan1.com;
    ssl_certificate     /etc/letsencrypt/live/wagwan1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wagwan1.com/privkey.pem;
    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    server_name api.wagwan1.com;
    ssl_certificate     /etc/letsencrypt/live/wagwan1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wagwan1.com/privkey.pem;
    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
