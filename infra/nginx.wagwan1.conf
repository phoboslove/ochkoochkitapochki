# Deployment-specific config for wagwan1.com — subdomain split:
#   wagwan1.com / www.wagwan1.com -> web (Next.js)
#   api.wagwan1.com               -> api (FastAPI)
#   s3.wagwan1.com                -> minio (public presigned-download endpoint)
# Generated for the wagwan1.com deploy; infra/nginx.conf (path-based, single
# domain) remains the generic template for other deployments.
#
# Referenced by infra/docker-compose.override.yml on the wagwan1.com server,
# which mounts this file (not nginx.conf) and the host's real
# /etc/letsencrypt directory instead of ./certs. See infra/README.md.

server {
    listen 80;
    server_name wagwan1.com www.wagwan1.com api.wagwan1.com s3.wagwan1.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wagwan1.com www.wagwan1.com;
    ssl_certificate     /etc/letsencrypt/live/wagwan1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wagwan1.com/privkey.pem;
    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    server_name api.wagwan1.com;
    ssl_certificate     /etc/letsencrypt/live/wagwan1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wagwan1.com/privkey.pem;
    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# MinIO — public endpoint used ONLY for presigned GET/PUT URLs. AWS SigV4
# presigned URLs sign the `host` header (see X-Amz-SignedHeaders=host), so
# nginx MUST forward the client's original Host unchanged — if it were
# rewritten to the upstream's own host:port, MinIO would recompute the
# signature against a different host and reject every request. The api
# container talks to MinIO directly over the internal Docker network
# (http://minio:9000) for actual put/get — this proxy exists only so
# presigned URLs handed to browsers/users resolve to something public.
server {
    listen 443 ssl http2;
    server_name s3.wagwan1.com;
    ssl_certificate     /etc/letsencrypt/live/wagwan1.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wagwan1.com/privkey.pem;
    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
